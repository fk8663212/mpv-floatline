# Stremio 外部 mpv 的介面設定
# 修改後重新開啟 mpv 即可套用。

# 控制列寬度與顯示時間
width=540
hide_delay=2
scale=1

# floating 為可拖曳懸浮控制列，bottom 為貼底控制列。
controls_layout=floating

# 三區的按鍵順序，可以移動、刪除或留空。
# 可用項目 volume, back, play, forward, tracks, playlist, settings, pin, fullscreen
# 每個項目會採用第一次出現的位置。
controls_left=volume
controls_center=back,play,forward
controls_right=tracks,playlist,settings,fullscreen
button_size=32
button_spacing=2

# 側欄方向 left / right
sidebar_side=right
sidebar_width=264
sidebar_open=no

# docked 會讓影片縮排，overlay 會覆蓋在影片上。
sidebar_mode=docked

# stacked 同時列出字幕與音軌，tabs 使用分頁切換。
sidebar_layout=stacked
# sub 為字幕，audio 為音軌，可調換順序。
sidebar_order=sub,audio

# 外觀。font 留空時沿用 mpv 的 osd-font。
font=
font_scale=1
radius=16
# 透明度為 0 到 1，1 為完全不透明。
panel_opacity=1
sidebar_opacity=1
# 純文字字幕背景和 macOS 原生深色標題列，可各自關閉。
subtitle_backdrop=yes
dark_title_bar=yes

# 色彩使用六位 RGB 色碼。
color_panel=232529
color_border=454B54
color_sidebar=1B1F25
color_text=EDF0F4
color_muted=ABB5C1
color_track=505A66
color_selected=334A4C
color_accent=B8DDD7
color_hover=39424E
